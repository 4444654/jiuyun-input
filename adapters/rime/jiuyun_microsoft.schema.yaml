# Generated independently from the shared key map. License: MIT
schema:
  schema_id: jiuyun_microsoft
  name: 玖云 · 微软双拼
  version: "0.1.0"
switches:
  - { name: ascii_mode, reset: 0, states: [中文, English] }
engine:
  processors: [ascii_composer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, table_translator]
  filters: [uniquifier]
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  initials: abcdefghijklmnopqrstuvwxyz
  delimiter: " "
translator:
  dictionary: jiuyun_microsoft
  enable_user_dict: true
  enable_completion: true
  enable_sentence: true
menu:
  page_size: 5
punctuator:
  import_preset: default
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
